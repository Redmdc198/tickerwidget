<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Market Ticker</title>

  <!-- Optional: tweak background to match Notion theme -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a; /* dark background */
    }
    .tradingview-widget-container {
      box-sizing: border-box;
      width: 100%;
      height: 50px; /* adjust if you want it taller */
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>

    <script type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
      async>
{
  "symbols": [
    { "title": "S&P 500",        "proName": "INDEX:SPX" },
    { "title": "NASDAQ",         "proName": "NASDAQ:IXIC" },
    { "title": "QQQ",            "proName": "NASDAQ:QQQ" },
    { "title": "Bitcoin",        "proName": "BITSTAMP:BTCUSD" },
    { "title": "Ethereum",       "proName": "BITSTAMP:ETHUSD" },
    { "title": "Solana",         "proName": "COINBASE:SOLUSD" },
    { "title": "IWM Small Caps", "proName": "AMEX:IWM" },
    { "title": "TNA 3x Microcap","proName": "AMEX:TNA" },
    { "title": "SOXX Semis",     "proName": "NASDAQ:SOXX" },
    { "title": "SMH Semis",      "proName": "NASDAQ:SMH" },
    { "title": "AIQ AI Sector",  "proName": "NYSEARCA:AIQ" },
    { "title": "ARKQ Robotics",  "proName": "AMEX:ARKQ" },
    { "title": "ARKW Web3",      "proName": "AMEX:ARKW" }
  ],
  "showSymbolLogo": true,
  "isTransparent": false,
  "colorTheme": "dark",
  "displayMode": "regular",
  "locale": "en"
}
    </script>
  </div>
</body>
</html>
